<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blishko's Casino</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Header Fixe -->
    <header id="main-header">
        <div class="logo">Blishko's Casino</div>
        <button id="wallet-btn" class="balance-btn" onclick="toggleWallet(true)">
            <span id="balance-amount">10.00</span> €
        </button>
    </header>

    <!-- Conteneur Principal -->
    <main id="app-container">
        <!-- VUE ACCUEIL -->
        <div id="home-view">
            <div class="games-grid" id="games-list">
                <!-- Généré en JS -->
            </div>
        </div>

        <!-- VUE JEU -->
        <div id="game-view" style="display: none;"></div>
    </main>

    <!-- VUE WALLET (OVERLAY PLEIN ÉCRAN) -->
    <div id="wallet-view" class="overlay-view" style="display: none;">
        <div class="wallet-header">
            <h2>Portefeuille</h2>
            <button class="close-btn" onclick="toggleWallet(false)">✕</button>
        </div>
        <div class="wallet-content">
            <div class="chart-wrapper">
                <canvas id="balanceChart"></canvas>
            </div>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Solde actuel</span>
                    <span class="stat-value" id="stat-balance">10.00 €</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Mises totales</span>
                    <span class="stat-value" id="stat-wager">0.00 €</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Plus gros gain</span>
                    <span class="stat-value" id="stat-biggest">0.00 €</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Meilleur jeu</span>
                    <span class="stat-value" id="stat-best">-</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Pire jeu</span>
                    <span class="stat-value" id="stat-worst">-</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Parties recommencées</span>
                    <span class="stat-value" id="stat-resets">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE GAME OVER -->
    <div id="game-over-modal" style="display: none;">
        <div class="game-over-content">
            <h1>BANKRUPT</h1>
            <p>Vous n'avez plus de fonds.</p>
            <button class="btn-reset" onclick="resetApp()">RECOMMENCER</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
