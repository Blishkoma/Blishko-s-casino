<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blishko's Casino</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header id="main-header">
        <div class="logo">Blishko's <span>Casino</span></div>
        <button id="wallet-btn" class="balance-btn" onclick="toggleWallet(true)">
            <span id="balance-amount">10.00</span> €
        </button>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="app-container">
        <div id="home-view">
            <div class="games-grid" id="games-list"></div>
        </div>
        <div id="game-view" style="display: none;"></div>
    </main>

    <!-- WALLET OVERLAY -->
    <div id="wallet-view" class="overlay-view" style="display: none;">
        <div class="wallet-header">
            <h2>Portefeuille & Stats</h2>
            <button class="close-btn" onclick="toggleWallet(false)">✕</button>
        </div>
        <div class="wallet-content">
            <div class="chart-wrapper">
                <canvas id="balanceChart"></canvas>
            </div>
            <div class="stats-container">
                <div class="stat-box"><span class="stat-label">Solde actuel</span><span class="stat-value" id="stat-balance">10.00 €</span></div>
                <div class="stat-box"><span class="stat-label">Mises totales</span><span class="stat-value" id="stat-wager">0.00 €</span></div>
                <div class="stat-box"><span class="stat-label">Plus gros gain</span><span class="stat-value" id="stat-biggest" style="color: var(--accent);">0.00 €</span></div>
                <div class="stat-box"><span class="stat-label">🔥 Meilleur jeu</span><span class="stat-value" id="stat-best">-</span></div>
                <div class="stat-box"><span class="stat-label">📉 Pire jeu</span><span class="stat-value" id="stat-worst">-</span></div>
                <div class="stat-box"><span class="stat-label">🔄 Recommencé</span><span class="stat-value" id="stat-resets">0 fois</span></div>
            </div>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="game-over-modal" style="display: none;">
        <div class="game-over-content">
            <h1>BANKRUPT</h1>
            <p>Fonds épuisés. La banque gagne toujours.</p>
            <button class="btn-reset" onclick="resetApp()">RECOMMENCER (+10.00 €)</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
