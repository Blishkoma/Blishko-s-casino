<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blishko's Casino</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js pour le graphique du Wallet -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header id="main-header">
        <div class="logo">Blishko's Casino</div>
        <button id="wallet-btn" class="balance" onclick="openWallet()">
            <span id="balance-amount">10.00</span> €
        </button>
    </header>

    <main id="app-container">
        <!-- Vue Accueil -->
        <div id="home-view">
            <div class="games-list" id="games-list"></div>
        </div>

        <!-- Vue Wallet / Statistiques -->
        <div id="wallet-view" style="display: none;">
            <div class="wallet-header">
                <button class="back-btn" onclick="closeWallet()">&larr; Retour</button>
                <h2>Portefeuille & Stats</h2>
            </div>
            
            <div class="chart-container">
                <canvas id="balanceChart"></canvas>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Mise totale jouée</h4>
                    <p id="stat-wager">0.00 €</p>
                </div>
                <div class="stat-card">
                    <h4>Plus gros gain</h4>
                    <p id="stat-biggest-win" style="color: var(--accent-green);">0.00 €</p>
                </div>
                <div class="stat-card">
                    <h4>Jeu le plus rentable</h4>
                    <p id="stat-best-game">-</p>
                </div>
            </div>
        </div>

        <!-- Vue Jeu (Générique) -->
        <div id="game-view" style="display: none;"></div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
